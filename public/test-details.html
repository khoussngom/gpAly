<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test des fonctionnalités dynamiques</title>
    <script src="../dist/main.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Test des fonctionnalités dynamiques</h1>
        
        <div class="bg-white p-6 rounded-lg shadow mb-6">
            <h2 class="text-xl font-semibold mb-4">Test des fonctions de détails</h2>
            <div class="space-y-4">
                <button onclick="testShowCargaisonDetail()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                    Test Détail Cargaison
                </button>
                
                <button onclick="testShowColisDetail()" 
                        class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">
                    Test Détail Colis
                </button>
                
                <button onclick="testEditCargaison()" 
                        class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-lg">
                    Test Édition Cargaison
                </button>
                
                <button onclick="testEditColis()" 
                        class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg">
                    Test Édition Colis
                </button>
                
                <button onclick="testDeleteCargaison()" 
                        class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                    Test Suppression Cargaison
                </button>
                
                <button onclick="testDeleteColis()" 
                        class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                    Test Suppression Colis
                </button>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Status</h2>
            <div id="status" class="text-gray-600">
                En attente de tests...
            </div>
        </div>
    </div>

    <script>
        function updateStatus(message) {
            document.getElementById('status').innerHTML = message;
        }
        
        function testShowCargaisonDetail() {
            updateStatus('Test: showCargaisonDetail...');
            if (window.detailsManager) {
                window.detailsManager.showCargaisonDetail('CARGO-001');
                updateStatus('✅ DetailsManager disponible - Fonction appelée');
            } else {
                updateStatus('❌ DetailsManager non disponible');
            }
        }
        
        function testShowColisDetail() {
            updateStatus('Test: showColisDetail...');
            if (window.detailsManager) {
                window.detailsManager.showColisDetail('COL-001');
                updateStatus('✅ DetailsManager disponible - Fonction appelée');
            } else {
                updateStatus('❌ DetailsManager non disponible');
            }
        }
        
        function testEditCargaison() {
            updateStatus('Test: editCargaison...');
            if (window.detailsManager) {
                window.detailsManager.editCargaison('CARGO-001');
                updateStatus('✅ DetailsManager disponible - Fonction appelée');
            } else {
                updateStatus('❌ DetailsManager non disponible');
            }
        }
        
        function testEditColis() {
            updateStatus('Test: editColis...');
            if (window.detailsManager) {
                window.detailsManager.editColis('COL-001');
                updateStatus('✅ DetailsManager disponible - Fonction appelée');
            } else {
                updateStatus('❌ DetailsManager non disponible');
            }
        }
        
        function testDeleteCargaison() {
            updateStatus('Test: deleteCargaison...');
            if (window.detailsManager) {
                window.detailsManager.deleteCargaison('CARGO-001');
                updateStatus('✅ DetailsManager disponible - Fonction appelée');
            } else {
                updateStatus('❌ DetailsManager non disponible');
            }
        }
        
        function testDeleteColis() {
            updateStatus('Test: deleteColis...');
            if (window.detailsManager) {
                window.detailsManager.deleteColis('COL-001');
                updateStatus('✅ DetailsManager disponible - Fonction appelée');
            } else {
                updateStatus('❌ DetailsManager non disponible');
            }
        }
        
        // Vérification de l'état au chargement
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.detailsManager) {
                    updateStatus('✅ DetailsManager initialisé avec succès');
                } else {
                    updateStatus('❌ DetailsManager non disponible au chargement');
                }
            }, 1000);
        });
    </script>
</body>
</html>
