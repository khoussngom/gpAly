<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Gp Aly</title>
</head>

<body class="w-screen h-screen">
    <div class="bg-blue-600 w-full h-full flex flex-col  overflow-y-scroll lg:flex-row items-center">
        <div class="ml-[3%] h-[90%] w-[90%]  mt-3 lg:w-[35%] rounded-xl bg-white lg:mr-3 flex ">
            <div class="w-full rounded-xl bg-white bg-gray-100 p-4">
                <div class="text-center font-bold text-2xl mb-10">Ajouter une cargaison</div>

                <button class="ml-5 justify-center shadow-xl items-center bg-green-600 rounded-xl text-white text-2xl mb-10 flex h-15 w-[90%] flex-1 hover:scale-105 transition-transform duration-200">Aerienne</button>
                <button class="ml-5 justify-center items-center bg-yellow-600 rounded-xl text-white text-2xl mb-10 flex h-15 w-[90%] flex-1 hover:scale-105 transition-transform duration-200 ">Maritime</button>
                <button class="ml-5 justify-center items-center bg-red-600 rounded-xl text-white text-2xl mb-10 flex h-15 w-[90%] flex-1 hover:scale-105 transition-transform duration-200">Routiére</button>

                <div id="form " class="flex flex-col gap-5 justify-between items-start ">
                    <div class="flex flex-col gap-2 flex-1 w-[98%] ">
                        <span>Libellé</span>
                        <input type="text " class="h-10 border border-black rounded-xl pl-5 " placeholder="Entrer le nom du produit ">
                    </div>

                    <div class="flex flex-col gap-2 flex-1 w-[98%] ">
                        <span>Poids</span>
                        <input type="text " class="h-10 border border-black rounded-xl pl-5 " placeholder="Entrer le poids du produit ">
                    </div>

                    <div class="flex flex-col gap-2 flex-1 w-[98%] ">
                        <span>Distance</span>
                        <input type="text " class="h-10 border border-black rounded-xl pl-5 " placeholder="Entrer la distance de la cargaison ">
                    </div>
                </div>


            </div>
        </div>
        <div class=" bg-white rounded-xl ml-[5%] lg:ml-[3%] h-[90%] w-[90%] lg:w-[60%] mt-3 mr-[3%]">

        </div>
    </div>

</body>

</html>
